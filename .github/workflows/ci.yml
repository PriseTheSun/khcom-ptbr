name: Public source checks (no game data)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'
      - name: Install locked format tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-tools.txt
      - name: Fetch and verify selected format sources
        env:
          PYTHONPATH: tools
        run: python -c 'from khcom.upstream import verify_upstream; verify_upstream(fetch=True)'
      - name: Build pinned independent BPS verifier
        run: |
          git init .deps/flips
          git -C .deps/flips remote add origin https://github.com/Sir-Walrus/Flips.git
          git -C .deps/flips fetch --depth=1 origin ff216a75df0987047a67d7923567dc4482ce07ac
          git -C .deps/flips checkout --detach FETCH_HEAD
          test "$(git -C .deps/flips rev-parse HEAD)" = ff216a75df0987047a67d7923567dc4482ce07ac
          make -C .deps/flips SRCDIR=. TARGET=cli CXX=g++ CFLAGS=-O2
      - name: Test authored fixtures
        env:
          KHCOM_FLIPS: ${{ github.workspace }}/.deps/flips/flips
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify source staging
        run: python tools/stage_sources.py --out stage/source-ci
      # No cache, artifact upload, game input, signing secret or publication.
